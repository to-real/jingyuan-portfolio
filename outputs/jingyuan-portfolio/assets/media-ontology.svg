<svg width="680" height="370" viewBox="0 0 680 370" xmlns="http://www.w3.org/2000/svg" role="img">
<title>媒体资源本体与检索链路</title>
<desc>资源本体四维度（身份、语境、权利、关系）围绕中心资源实体，底部展示证据优先的检索链路</desc>

<style>
  .th { font-family: Charter, Georgia, "Noto Serif CJK SC", "Songti SC", serif; font-size: 14px; font-weight: 500; fill: #141413; }
  .ts { font-family: Charter, Georgia, "Noto Serif CJK SC", "Songti SC", serif; font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .th-inv { font-family: Charter, Georgia, "Noto Serif CJK SC", "Songti SC", serif; font-size: 14px; font-weight: 500; fill: #faf9f5; }
  .ts-inv { font-family: Charter, Georgia, "Noto Serif CJK SC", "Songti SC", serif; font-size: 12px; font-weight: 400; fill: #B4B2A9; }
  .arr { stroke: #B4B2A9; stroke-width: 1.5; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Central entity -->
<rect x="270" y="92" width="140" height="46" rx="6" fill="#1B365D" stroke="#1B365D" stroke-width="0.5"/>
<text class="th-inv" x="340" y="116" text-anchor="middle" dominant-baseline="central">媒体资源</text>

<!-- 4 dimension clusters -->
<!-- Top-left: 资源身份 -->
<rect x="45" y="25" width="185" height="52" rx="6" fill="#e8e6dc" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="137" y="45" text-anchor="middle" dominant-baseline="central">资源身份</text>
<text class="ts" x="137" y="63" text-anchor="middle" dominant-baseline="central">类型 · 来源 · 主题 · 版本</text>

<!-- Top-right: 使用语境 -->
<rect x="450" y="25" width="185" height="52" rx="6" fill="#e8e6dc" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="542" y="45" text-anchor="middle" dominant-baseline="central">使用语境</text>
<text class="ts" x="542" y="63" text-anchor="middle" dominant-baseline="central">所属项目 · 位置 · 更新时间</text>

<!-- Bottom-left: 权利信息 -->
<rect x="45" y="155" width="185" height="52" rx="6" fill="#e8e6dc" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="137" y="175" text-anchor="middle" dominant-baseline="central">权利信息</text>
<text class="ts" x="137" y="193" text-anchor="middle" dominant-baseline="central">作者 · 许可 · 授权范围 · 到期</text>

<!-- Bottom-right: 关系网络 -->
<rect x="450" y="155" width="185" height="52" rx="6" fill="#e8e6dc" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="542" y="175" text-anchor="middle" dominant-baseline="central">关系网络</text>
<text class="ts" x="542" y="193" text-anchor="middle" dominant-baseline="central">跨项目引用 · 衍生 · 组合</text>

<!-- Connection lines: center to 4 clusters -->
<line x1="280" y1="105" x2="232" y2="72" stroke="#B4B2A9" stroke-width="0.5" opacity="0.6"/>
<line x1="400" y1="105" x2="448" y2="72" stroke="#B4B2A9" stroke-width="0.5" opacity="0.6"/>
<line x1="280" y1="128" x2="232" y2="160" stroke="#B4B2A9" stroke-width="0.5" opacity="0.6"/>
<line x1="400" y1="128" x2="448" y2="160" stroke="#B4B2A9" stroke-width="0.5" opacity="0.6"/>

<!-- Cross connections (lighter, showing relationships between dimensions) -->
<line x1="230" y1="50" x2="450" y2="50" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 4" opacity="0.2"/>
<line x1="230" y1="180" x2="450" y2="180" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 4" opacity="0.2"/>

<!-- Divider -->
<line x1="55" y1="240" x2="625" y2="240" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 4" opacity="0.3"/>

<!-- Retrieval pipeline (bottom) -->
<text class="ts" x="340" y="260" text-anchor="middle" dominant-baseline="central" opacity="0.55">检索链路</text>

<rect x="32" y="275" width="108" height="36" rx="4" fill="#e8e6dc" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="ts" x="86" y="294" text-anchor="middle" dominant-baseline="central">意图识别</text>

<rect x="164" y="275" width="108" height="36" rx="4" fill="#e8e6dc" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="ts" x="218" y="294" text-anchor="middle" dominant-baseline="central">多维检索</text>

<rect x="296" y="275" width="108" height="36" rx="4" fill="#e8e6dc" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="ts" x="350" y="294" text-anchor="middle" dominant-baseline="central">权利过滤</text>

<rect x="428" y="275" width="108" height="36" rx="4" fill="#e8e6dc" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="ts" x="482" y="294" text-anchor="middle" dominant-baseline="central">证据组织</text>

<rect x="560" y="275" width="88" height="36" rx="4" fill="#e8e6dc" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="ts" x="604" y="294" text-anchor="middle" dominant-baseline="central">交付</text>

<!-- Retrieval arrows -->
<line x1="142" y1="293" x2="162" y2="293" class="arr" marker-end="url(#a)"/>
<line x1="274" y1="293" x2="294" y2="293" class="arr" marker-end="url(#a)"/>
<line x1="406" y1="293" x2="426" y2="293" class="arr" marker-end="url(#a)"/>
<line x1="538" y1="293" x2="558" y2="293" class="arr" marker-end="url(#a)"/>

<!-- Bottom annotation -->
<text class="ts" x="340" y="340" text-anchor="middle" dominant-baseline="central" opacity="0.45">每一步输出均保留来源链接、授权说明与推荐依据</text>

</svg>
