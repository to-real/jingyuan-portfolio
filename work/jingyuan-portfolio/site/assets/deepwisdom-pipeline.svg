<svg width="680" height="430" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Agent 评测闭环</title>
<desc>从任务定义到报告回流的评测流程：记录层、评测层（硬检查与 LLM Judge 双路径）、报告与反馈回流</desc>

<style>
  .th { font-family: Charter, Georgia, "Noto Serif CJK SC", "Songti SC", serif; font-size: 14px; font-weight: 500; fill: #141413; }
  .ts { font-family: Charter, Georgia, "Noto Serif CJK SC", "Songti SC", serif; font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .th-inv { font-family: Charter, Georgia, "Noto Serif CJK SC", "Songti SC", serif; font-size: 14px; font-weight: 500; fill: #faf9f5; }
  .ts-inv { font-family: Charter, Georgia, "Noto Serif CJK SC", "Songti SC", serif; font-size: 12px; font-weight: 400; fill: #B4B2A9; }
  .arr { stroke: #B4B2A9; stroke-width: 1.5; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Row 1: Recording -->
<rect x="55" y="42" width="168" height="52" rx="6" fill="#e8e6dc" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="139" y="62" text-anchor="middle" dominant-baseline="central">Task &amp; dataset</text>
<text class="ts" x="139" y="80" text-anchor="middle" dominant-baseline="central">输入 · 环境 · 成功条件</text>

<rect x="258" y="42" width="168" height="52" rx="6" fill="#e8e6dc" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="342" y="62" text-anchor="middle" dominant-baseline="central">Run &amp; trace</text>
<text class="ts" x="342" y="80" text-anchor="middle" dominant-baseline="central">执行路径 · 工具调用 · 中间状态</text>

<rect x="461" y="42" width="168" height="52" rx="6" fill="#e8e6dc" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="545" y="62" text-anchor="middle" dominant-baseline="central">Evidence</text>
<text class="ts" x="545" y="80" text-anchor="middle" dominant-baseline="central">收集 · 结构化 · 可追溯</text>

<line x1="225" y1="68" x2="256" y2="68" class="arr" marker-end="url(#a)"/>
<line x1="428" y1="68" x2="459" y2="68" class="arr" marker-end="url(#a)"/>

<!-- Fork -->
<line x1="545" y1="96" x2="545" y2="122" class="arr"/>
<circle cx="545" cy="122" r="3" fill="#888780"/>
<path d="M545 122 L205 122 L205 148" fill="none" class="arr" marker-end="url(#a)"/>
<path d="M545 122 L475 122 L475 148" fill="none" class="arr" marker-end="url(#a)"/>

<!-- Row 2: Evaluation (dual path) -->
<rect x="105" y="150" width="200" height="52" rx="6" fill="#e8e6dc" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="205" y="170" text-anchor="middle" dominant-baseline="central">Hard checks</text>
<text class="ts" x="205" y="188" text-anchor="middle" dominant-baseline="central">格式 · 完整性 · 工具正确性</text>

<rect x="375" y="150" width="200" height="52" rx="6" fill="#e8e6dc" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="475" y="170" text-anchor="middle" dominant-baseline="central">Rubric &amp; judge</text>
<text class="ts" x="475" y="188" text-anchor="middle" dominant-baseline="central">多维评分 · 逐步归因 · 校准</text>

<!-- Calibration annotation -->
<text class="ts" x="582" y="157" dominant-baseline="central" opacity="0.65">↕ 人工校准</text>
<text class="ts" x="582" y="173" dominant-baseline="central" opacity="0.65">目标 ≥75%</text>

<!-- Merge -->
<path d="M205 204 L205 230 L340 230" fill="none" class="arr"/>
<path d="M475 204 L475 230 L340 230" fill="none" class="arr"/>
<circle cx="340" cy="230" r="3" fill="#888780"/>
<line x1="340" y1="230" x2="340" y2="256" class="arr" marker-end="url(#a)"/>

<!-- Row 3: Report (accent) -->
<rect x="215" y="258" width="250" height="52" rx="6" fill="#1B365D" stroke="#1B365D" stroke-width="0.5"/>
<text class="th-inv" x="340" y="278" text-anchor="middle" dominant-baseline="central">Report</text>
<text class="ts-inv" x="340" y="296" text-anchor="middle" dominant-baseline="central">失败标签 · 逐步归因 · 改进行动</text>

<!-- Split to feedback targets -->
<line x1="340" y1="312" x2="340" y2="330" class="arr"/>
<circle cx="340" cy="330" r="3" fill="#888780"/>
<path d="M340 330 L175 330 L175 347" fill="none" class="arr" marker-end="url(#a)"/>
<line x1="340" y1="330" x2="340" y2="347" class="arr" marker-end="url(#a)"/>
<path d="M340 330 L505 330 L505 347" fill="none" class="arr" marker-end="url(#a)"/>

<!-- Feedback targets -->
<rect x="115" y="349" width="120" height="34" rx="4" fill="#e8e6dc" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="ts" x="175" y="367" text-anchor="middle" dominant-baseline="central">Prompt 迭代</text>

<rect x="280" y="349" width="120" height="34" rx="4" fill="#e8e6dc" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="ts" x="340" y="367" text-anchor="middle" dominant-baseline="central">Agent 策略</text>

<rect x="445" y="349" width="120" height="34" rx="4" fill="#e8e6dc" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="ts" x="505" y="367" text-anchor="middle" dominant-baseline="central">SFT 数据筛选</text>

<!-- Return arrow (feedback loop) -->
<path d="M115 366 L28 366 L28 68 L53 68" fill="none" stroke="#B4B2A9" stroke-width="1" marker-end="url(#a)" stroke-dasharray="5 3" opacity="0.5"/>
<text class="ts" x="18" y="220" dominant-baseline="central" text-anchor="middle" opacity="0.4" transform="rotate(-90 18 220)">↻ 回流</text>

</svg>
