<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>FunloomAI 生成与编辑流程</title>
<desc>从意图解析到局部编辑的四阶段用户流程，编辑循环保留上下文，底部标注模板与模型的分工</desc>

<style>
  .th { font-family: Charter, Georgia, "Noto Serif CJK SC", "Songti SC", serif; font-size: 14px; font-weight: 500; fill: #141413; }
  .ts { font-family: Charter, Georgia, "Noto Serif CJK SC", "Songti SC", serif; font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .th-inv { font-family: Charter, Georgia, "Noto Serif CJK SC", "Songti SC", serif; font-size: 14px; font-weight: 500; fill: #faf9f5; }
  .ts-inv { font-family: Charter, Georgia, "Noto Serif CJK SC", "Songti SC", serif; font-size: 12px; font-weight: 400; fill: #B4B2A9; }
  .arr { stroke: #B4B2A9; stroke-width: 1.5; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Main flow: 4 stages -->
<rect x="35" y="45" width="138" height="52" rx="6" fill="#e8e6dc" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="104" y="65" text-anchor="middle" dominant-baseline="central">意图与规格</text>
<text class="ts" x="104" y="83" text-anchor="middle" dominant-baseline="central">题材 · 玩法 · 角色 · 胜负</text>

<rect x="203" y="45" width="138" height="52" rx="6" fill="#e8e6dc" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="272" y="65" text-anchor="middle" dominant-baseline="central">任务规划</text>
<text class="ts" x="272" y="83" text-anchor="middle" dominant-baseline="central">代码 · 素材 · 关卡 · 验证</text>

<rect x="371" y="45" width="138" height="52" rx="6" fill="#e8e6dc" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="440" y="65" text-anchor="middle" dominant-baseline="central">生成与预览</text>
<text class="ts" x="440" y="83" text-anchor="middle" dominant-baseline="central">阶段进度 · 可玩结果</text>

<rect x="539" y="45" width="106" height="52" rx="6" fill="#1B365D" stroke="#1B365D" stroke-width="0.5"/>
<text class="th-inv" x="592" y="65" text-anchor="middle" dominant-baseline="central">局部编辑</text>
<text class="ts-inv" x="592" y="83" text-anchor="middle" dominant-baseline="central">继承上下文</text>

<!-- Arrows between stages -->
<line x1="175" y1="71" x2="201" y2="71" class="arr" marker-end="url(#a)"/>
<line x1="343" y1="71" x2="369" y2="71" class="arr" marker-end="url(#a)"/>
<line x1="511" y1="71" x2="537" y2="71" class="arr" marker-end="url(#a)"/>

<!-- Edit loop: from Edit back to Generation -->
<path d="M592 99 L592 130 L440 130 L440 99" fill="none" stroke="#1B365D" stroke-width="1.2" marker-end="url(#a)" stroke-dasharray="5 3" opacity="0.6"/>
<text class="ts" x="516" y="146" text-anchor="middle" dominant-baseline="central" opacity="0.6">限定变更范围 · 保留已有内容</text>

<!-- Verification signal between Generation and Edit -->
<text class="ts" x="524" y="40" text-anchor="middle" dominant-baseline="central" opacity="0.55">验收信号 ↓</text>

<!-- Architecture annotation -->
<line x1="55" y1="195" x2="625" y2="195" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 4" opacity="0.35"/>

<rect x="55" y="215" width="260" height="42" rx="4" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.5"/>
<text class="ts" x="185" y="231" text-anchor="middle" dominant-baseline="central" opacity="0.65">模板与确定性规则</text>
<text class="ts" x="185" y="247" text-anchor="middle" dominant-baseline="central" opacity="0.5">结构稳定、可预期的环节</text>

<rect x="365" y="215" width="260" height="42" rx="4" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.5"/>
<text class="ts" x="495" y="231" text-anchor="middle" dominant-baseline="central" opacity="0.65">LLM 能力</text>
<text class="ts" x="495" y="247" text-anchor="middle" dominant-baseline="central" opacity="0.5">意图理解、规划与局部修改</text>

<!-- Dashed connectors from annotation to stages -->
<path d="M185 215 L185 99" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.3"/>
<path d="M495 215 L495 99" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.3"/>

<!-- Bottom annotation -->
<text class="ts" x="340" y="285" text-anchor="middle" dominant-baseline="central" opacity="0.5">首次生成建立可能性，局部编辑赋予用户控制权</text>

</svg>
